name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  jobs: install dependencies
  backend: 
   
      - name: hybrid
   actions: runners 
  runs-on: ubuntu-latest
  defaults: local first
  working-directory: working copy
  bsteps:
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
         npm ci

      - name: Test
        run: |
         npm test --runInBand
